name: Dependency Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

permissions: {}

jobs:
  dependency-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          profile: minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true
      - name: Install dependency monitor tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - name: Run dependency monitor
        run: |
          chmod +x scripts/run-dependency-monitor.sh
          scripts/run-dependency-monitor.sh target/security
      - name: Upload dependency telemetry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-monitor-logs
          path: target/security
