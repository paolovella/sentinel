\* NHICredentialRotation.cfg — TLC model checker configuration
\*
\* NHI ephemeral credential rotation lifecycle.
\* Verifies NHI-ROT-1 through NHI-ROT-5 safety invariants with 3
\* credentials and max time 6.
\*
\* Note: Liveness properties (NHI-ROT-L1/L2) require larger state space
\* and are checked separately. Safety invariants are the priority.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* --- Constants ---

CONSTANT
    CredIds <- MC_CredIds
    MaxTime <- MC_MaxTime

\* --- Safety Invariants ---

INVARIANT TypeOK
INVARIANT InvariantNHIROT1_NoUseAfterExpiry
INVARIANT InvariantNHIROT3_AtMostTwoActive
INVARIANT InvariantNHIROT4_NormalHasOneActive
INVARIANT InvariantNHIROT5_ActiveConsistentDuringRotation
