name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependency graph review requires GitHub Advanced Security (GHAS).
    # Fails hard on moderate+ severity and GPL/AGPL/LGPL licenses.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0,GPL-3.0,AGPL-3.0,LGPL-2.1,LGPL-3.0
          # r-efi is tri-licensed; GitHub's deny-list check flags the LGPL branch
          # even though consumers can take the permissive MIT/Apache terms.
          allow-dependencies-licenses: pkg:cargo/r-efi@6.0.0
          comment-summary-in-pr: always
