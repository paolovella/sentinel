name: Python SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "scripts/check-python-package.sh"
  pull_request:
    paths:
      - "sdk/python/**"
      - "scripts/check-python-package.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sdk/python
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Test
        working-directory: sdk/python
        run: python -m pytest -v --tb=short

      - name: Type check
        if: matrix.python-version == '3.12'
        working-directory: sdk/python
        run: python -m mypy vellaveto/ --ignore-missing-imports

      - name: Lint critical Python issues
        if: matrix.python-version == '3.12'
        working-directory: sdk/python
        run: python -m ruff check --select E9,F vellaveto

      - name: Install build tools
        if: matrix.python-version == '3.12'
        working-directory: sdk/python
        run: pip install --require-hashes --no-deps -r requirements-build.txt

      - name: Check Python package contract
        if: matrix.python-version == '3.12'
        run: bash scripts/check-python-package.sh sdk/python
