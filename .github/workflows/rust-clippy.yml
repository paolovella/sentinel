# Runs rust-clippy and uploads results as SARIF to GitHub Code Scanning.

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 1 * * 0'

permissions: {}

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install required cargo tools
        run: |
          cargo install clippy-sarif --version 0.8.0 --locked
          cargo install sarif-fmt --version 0.8.0 --locked

      - name: Run rust-clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy \
            --workspace \
            --all-targets \
            --locked \
            --message-format=json \
            -- -D warnings -D unsafe-code -A clippy::uninlined_format_args -A clippy::field_reassign_with_default -A clippy::const_is_empty -A clippy::unnecessary_literal_unwrap -A clippy::assertions_on_constants \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

      - name: Fail on clippy policy violations
        if: steps.clippy.outcome == 'failure'
        run: exit 1
