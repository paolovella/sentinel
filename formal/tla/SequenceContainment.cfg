\* SequenceContainment.cfg — TLC model checker configuration
\*
\* Phase 6.3E: Behavioral sequence analysis containment.
\* Verifies SQ1–SQ4 safety invariants with small warmup (3 calls)
\* and max 2 new tools after taint.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

\* --- Constants ---

CONSTANT
    WarmupCalls <- const_WarmupCalls
    WindowMs <- const_WindowMs
    MaxNewTools <- const_MaxNewTools

\* --- Safety Invariants ---

INVARIANT SQ2_RestrictionMonotonicity
INVARIANT SQ3_AnomalyImpliesRestriction
INVARIANT SQ4_WarmupDoesNotSuppressTaint
