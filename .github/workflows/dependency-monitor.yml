name: Dependency Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

permissions: {}

jobs:
  dependency-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          profile: minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true
      - name: Install dependency monitor tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - name: Run dependency monitor
        run: |
          chmod +x scripts/run-dependency-monitor.sh
          scripts/run-dependency-monitor.sh target/security
      - name: Upload dependency telemetry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-monitor-logs
          path: target/security
