[package]
name = "mcpsec"
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
description = "MCP Security Benchmark Framework — vendor-neutral security evaluation for MCP gateways"
repository = "https://github.com/vellaveto/vellaveto"
homepage = "https://vellaveto.online"
keywords = ["mcp", "security", "benchmark", "ai-agent"]
categories = ["command-line-utilities"]
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "mcpsec"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
chrono = { workspace = true }

[dev-dependencies]
tokio = { version = "1.50", features = ["full", "test-util"] }
axum = "0.8"
hyper = "1.6"
