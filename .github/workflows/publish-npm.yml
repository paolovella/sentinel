name: Publish npm packages

on:
  # No longer triggers on tags — release.yml orchestrator handles publishing.
  # Keep workflow_dispatch for manual re-runs if needed.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages from a version tag instead of running validation only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  test:
    name: Test TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Check npm package contract
        working-directory: sdk/typescript
        run: bash ../../scripts/check-npm-package.sh .

      - name: Test
        working-directory: sdk/typescript
        run: npm test

  validate-create:
    name: Validate create-vellaveto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: packages/create-vellaveto
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: packages/create-vellaveto
        run: npm run build

      - name: Check npm package contract
        working-directory: packages/create-vellaveto
        run: bash ../../scripts/check-npm-package.sh .

  publish-sdk:
    name: Publish @vellaveto-sdk/typescript
    needs: test
    runs-on: ubuntu-latest
    if: inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/@vellaveto-sdk/typescript
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Check npm package contract
        working-directory: sdk/typescript
        run: bash ../../scripts/check-npm-package.sh .

      - name: Publish to npm
        working-directory: sdk/typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-create:
    name: Publish create-vellaveto
    needs: [test, validate-create]
    runs-on: ubuntu-latest
    if: inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/create-vellaveto
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: packages/create-vellaveto
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: packages/create-vellaveto
        run: npm run build

      - name: Check npm package contract
        working-directory: packages/create-vellaveto
        run: bash ../../scripts/check-npm-package.sh .

      - name: Publish to npm
        working-directory: packages/create-vellaveto
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
