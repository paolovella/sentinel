name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        type: boolean
        default: true

# Requires CARGO_REGISTRY_TOKEN secret configured in repository settings
# Get token from: https://crates.io/settings/tokens

permissions:
  contents: read

jobs:
  publish:
    name: Publish Workspace Crates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cargo
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true

      - name: Run tests before publish
        run: cargo test --workspace --locked

      - name: Check version alignment
        run: scripts/check-versions.sh

      - name: Guard real publish ref
        if: ${{ inputs.dry_run == false }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Non-dry-run crates.io publishing must run from a version tag (refs/tags/v*). Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run }}"
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
            echo "=== DRY RUN MODE ==="
          fi

          # Publish in dependency order (leaves first)
          CRATES=(
            vellaveto-types
            vellaveto-canonical
            vellaveto-canary
            vellaveto-config
            vellaveto-discovery
            vellaveto-engine
            vellaveto-audit
            vellaveto-approval
            vellaveto-mcp-shield
            vellaveto-mcp
            vellaveto-tls
            vellaveto-cluster
            vellaveto-http-proxy-shield
            vellaveto-http-proxy
            vellaveto-server
            vellaveto-proxy
            vellaveto-shield
            vellaveto-operator
          )

          for crate in "${CRATES[@]}"; do
            echo "--- Publishing $crate ---"
            OUTPUT=$(cargo publish -p "$crate" $FLAGS --locked 2>&1) || {
              if echo "$OUTPUT" | grep -qE "already (uploaded|exists)"; then
                echo "$crate already published, skipping"
                continue
              fi
              echo "$OUTPUT"
              echo "Failed to publish $crate"
              exit 1
            }
            if [ "$DRY_RUN" != "true" ]; then
              echo "Waiting for crates.io index update..."
              sleep 30
            fi
          done

          echo "=== All crates published successfully ==="
