name: Publish Python SDK

on:
  # No longer triggers on tags — release.yml orchestrator handles publishing.
  # Keep workflow_dispatch for manual re-runs if needed.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd sdk/python
          pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Run tests
        run: |
          cd sdk/python
          pytest tests/ -v --tb=short

      - name: Type check
        if: matrix.python-version == '3.12'
        run: |
          cd sdk/python
          python -m mypy vellaveto/ --ignore-missing-imports

      - name: Lint critical Python issues
        if: matrix.python-version == '3.12'
        run: |
          cd sdk/python
          python -m ruff check --select E9,F vellaveto

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/vellaveto-sdk
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes --no-deps -r sdk/python/requirements-build.txt

      - name: Check Python package contract
        run: bash scripts/check-python-package.sh sdk/python

      - name: Build package
        run: |
          cd sdk/python
          python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: sdk/python/dist/
          # Uses trusted publishing (OIDC) - configure at pypi.org/manage/project/vellaveto-sdk/settings/publishing/
