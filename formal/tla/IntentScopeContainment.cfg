\* IntentScopeContainment.cfg — TLC model checker configuration
\*
\* Phase 6.2E: Intent scope declaration containment.
\* Verifies IS1–IS4 safety invariants on a small model with 4 sink
\* classes. Scope narrowing and locking are the key safety properties.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTRAINT StateConstraint

\* --- Constants ---

CONSTANT
    SinkClasses <- const_SinkClasses
    AllowedSinks <- const_AllowedSinks
    TrustRanks <- const_TrustRanks

\* --- Safety Invariants ---

INVARIANT IS1_EnforcementCompleteness
INVARIANT IS2_MonotonicNarrowing
INVARIANT IS3_RestrictionSubset
INVARIANT IS4_AtomicRestriction
