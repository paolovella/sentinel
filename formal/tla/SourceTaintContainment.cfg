\* SourceTaintContainment.cfg — TLC model checker configuration
\*
\* Phase 6.1D: Source-class tainting containment.
\* Verifies ST1–ST4 safety invariants on a small model with 3 tools
\* (1 untrusted, 1 verified, 1 unknown) and 5 sink classes.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* Bound state space for tractable model checking
CONSTRAINT StateConstraint

\* --- Constants ---

CONSTANT
    Tools <- const_Tools
    UntrustedTools <- const_UntrustedTools
    VerifiedTools <- const_VerifiedTools
    SinkClasses <- const_SinkClasses
    TrustRanks <- const_TrustRanks

\* --- Safety Invariants ---

INVARIANT ST1_UntrustedSourcesTaint
INVARIANT ST3_PrivilegedSinkUnreachable
INVARIANT ST4_AutoTaintWithoutDetection
