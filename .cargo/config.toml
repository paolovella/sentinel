# Cargo configuration for this workspace.
#
# ---------------------------------------------------------------------------
# TEMPORARY dependency patch — REVIEW BY 2026-12-01
#
# Remove this entire [patch.crates-io] section, and the matching `allow-git`
# entry in deny.toml, as soon as tinyvec 1.13.1+ is published or 1.13.0 is
# yanked. Regenerate Cargo.lock and fuzz/Cargo.lock in the same change.
# ---------------------------------------------------------------------------
#
# tinyvec 1.13.0 does not compile:
#
#     error: cannot find macro `vec` in this scope
#       --> tinyvec-1.13.0/src/tinyvec.rs:710:21
#     note: `vec` is imported here, but it is a module, not a macro
#
# The committed Cargo.lock pins a working version, which is enough for every
# job that builds the workspace. It is not enough for `cargo semver-checks`:
# that tool builds each crate inside a generated placeholder project under
# target/semver-checks/local-<crate>-<hash>/ which declares itself its own
# workspace root, depends on the real crate by path, and writes its own
# lockfile. Neither the root lock nor a [patch] in the root Cargo.toml reaches
# it. A [patch] here does, because cargo config discovery walks up from that
# directory to the repository root.
#
# Pinned by `rev` rather than by tag because deny.toml sets
# `required-git-spec = "rev"` — a tag can be moved upstream, a commit cannot.
# 347ddc6463159eec38d3758a8881a22f44d50373 is the commit tagged v1.12.0, the
# last release that builds, and the version the lockfile already resolved to.
# (v1.12.0 is an annotated tag; 399ed78c… is the tag object, not the commit.)
[patch.crates-io]
tinyvec = { git = "https://github.com/Lokathor/tinyvec", rev = "347ddc6463159eec38d3758a8881a22f44d50373" }
