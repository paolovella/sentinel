# Runs rust-clippy and uploads results as SARIF to GitHub Code Scanning.

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 1 * * 0'

permissions: {}

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install required cargo tools
        run: |
          cargo install clippy-sarif --version 0.8.0 --locked
          cargo install sarif-fmt --version 0.8.0 --locked

      - name: Run rust-clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy \
            --workspace \
            --all-targets \
            --locked \
            --message-format=json \
            -- -D warnings -D unsafe-code -A clippy::uninlined_format_args -A clippy::field_reassign_with_default -A clippy::const_is_empty -A clippy::unnecessary_literal_unwrap -A clippy::assertions_on_constants \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

      - name: Fail on clippy policy violations
        if: steps.clippy.outcome == 'failure'
        run: exit 1
