name: Provenance and SBOM

on:
  # No longer triggers on tags — release.yml orchestrator handles provenance.
  # Keep workflow_dispatch for manual re-runs if needed.
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance-and-sbom:
    name: Build Provenance and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true

      - name: Verify lockfile immutability
        run: |
          cargo metadata --locked --format-version=1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Build release artifacts
        run: cargo build --release --workspace --locked

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vellaveto-sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Attest release binaries provenance
        if: ${{ github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            target/release/vellaveto
            target/release/vellaveto-proxy
            target/release/vellaveto-http-proxy
            target/release/vellaveto-shield

      - name: Skip attestation on private repositories
        if: ${{ github.event.repository.private == true && vars.ENABLE_ATTESTATIONS != 'true' }}
        run: |
          echo "Attestations are unavailable for private user-owned repositories."
          echo "Set ENABLE_ATTESTATIONS=true once repository settings support this feature."

      - name: Verify provenance attestations
        if: ${{ github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in \
            target/release/vellaveto \
            target/release/vellaveto-proxy \
            target/release/vellaveto-http-proxy \
            target/release/vellaveto-shield; do
            if [ ! -f "$artifact" ]; then
              echo "::error::Expected build artifact missing: $artifact"
              exit 1
            fi
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/provenance-sbom.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners \
              >/dev/null
          done
